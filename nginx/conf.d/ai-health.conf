upstream aha_web { server web:3000; }
upstream aha_api { server api:3001; }

# ---------------------------------------------------------------
#  HTTP 模式（当前使用：无域名 / 未备案阶段，直接用公网 IP 访问）
#  有域名 + 证书后，改用 ai-health.ssl.conf.example 覆盖本文件
# ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---------- API（含 SSE 流式对话）----------
    # 注意：proxy_pass 末尾不加 / ，保留 /api 前缀；
    # NestJS 侧有 setGlobalPrefix('api')，两边只能保留一处
    location /api/ {
        proxy_pass         http://aha_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关闭缓冲，否则前端收不到增量流
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---------- Next.js 前端 ----------
    location / {
        proxy_pass         http://aha_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://aha_web;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
