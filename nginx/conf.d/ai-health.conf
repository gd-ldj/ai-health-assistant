# ================================================================
#  AI 健康助手 · Nginx 站点配置
#  两个入口：
#    1) HTTP :80  —— 用公网 IP 直接访问（域名不可用时的兜底）
#    2) HTTPS :443 —— aha.117588.xyz（Cloudflare 源站证书，Full strict）
# ================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    include /etc/nginx/conf.d/_locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aha.117588.xyz;

    # Cloudflare Origin CA 证书（15 年，仅用于 CF ↔ 源站加密）
    ssl_certificate     /etc/letsencrypt/origin.pem;
    ssl_certificate_key /etc/letsencrypt/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    include /etc/nginx/conf.d/_locations.inc;
}
