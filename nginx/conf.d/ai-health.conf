upstream aha_web { server web:3000; }
upstream aha_api { server api:3001; }

server {
    listen 80;
    server_name _;

    # certbot webroot 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 未配证书时先把 HTTP 全站跳转 HTTPS（证书就绪后启用）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/change-me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/change-me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- API（含 SSE 流式对话）----------
    location /api/ {
        proxy_pass         http://aha_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关闭缓冲，否则前端收不到增量流
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;

        # WebSocket 升级（后续若接入实时语音）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---------- Next.js 前端 ----------
    location / {
        proxy_pass         http://aha_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---------- 静态资源缓存 ----------
    location /_next/static/ {
        proxy_pass http://aha_web;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
